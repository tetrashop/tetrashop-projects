<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لاگ زنده – TetraShop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', 'Courier New', monospace; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #22c55e; margin-bottom: 10px; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; transition: all 0.2s; }
        .btn-pause { background: #f59e0b; color: #1f2937; }
        .btn-clear { background: #dc2626; color: white; }
        .btn-export { background: #2563eb; color: white; }
        .btn-speed { background: #7c3aed; color: white; }
        .btn:hover { opacity: 0.9; }
        .stat-badge { background: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 0.85em; }
        .stat-badge span { color: #22c55e; font-weight: bold; }
        .log-container { background: #020617; border-radius: 12px; padding: 16px; height: 70vh; overflow-y: auto; font-size: 14px; border: 1px solid #334155; }
        .log-entry { padding: 6px 0; border-bottom: 1px solid #1e293b; display: flex; gap: 12px; font-size: 0.9em; }
        .log-entry:hover { background: #1e293b; }
        .log-time { color: #fbbf24; white-space: nowrap; min-width: 80px; }
        .log-type { font-weight: bold; min-width: 80px; }
        .type-info { color: #38bdf8; }
        .type-warn { color: #f59e0b; }
        .type-error { color: #ef4444; }
        .type-success { color: #22c55e; }
        .log-message { flex: 1; }
        .paused { opacity: 0.5; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #38bdf8; text-decoration: none; }
        @media (max-width: 600px) { .log-entry { flex-direction: column; gap: 2px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 لاگ زنده TetraShop</h1>
        <p style="text-align:center;color:#94a3b8;margin-bottom:15px;">پایش لحظه‌ای وضعیت سرور و رویدادهای سیستم</p>

        <div class="toolbar">
            <span class="stat-badge">📡 وضعیت: <span id="badgeStatus">--</span></span>
            <span class="stat-badge">⏱️ آپتایم: <span id="badgeUptime">--</span></span>
            <span class="stat-badge">💾 حافظه: <span id="badgeMemory">--</span></span>
            <span class="stat-badge">🚦 درخواست: <span id="badgeRequests">--</span></span>
            <button class="btn btn-pause" onclick="togglePause()" id="pauseBtn">⏸️ توقف</button>
            <button class="btn btn-clear" onclick="clearLog()">🗑️ پاک کردن</button>
            <button class="btn btn-export" onclick="exportLog()">📥 خروجی JSON</button>
        </div>

        <div class="log-container" id="logContainer"></div>

        <div class="back-link"><a href="/">🏠 بازگشت به فروشگاه</a></div>
    </div>

    <script>
        let isPaused = false;
        let requestCount = 0;
        const maxEntries = 200;
        const interval = 2000;

        const logTypes = ['info', 'info', 'info', 'warn', 'error', 'success'];
        const logIcons = { info: 'ℹ️', warn: '⚠️', error: '❌', success: '✅' };

        function getLogType(severity) {
            if (severity === 0) return { type: 'success', icon: '✅' };
            if (severity === 1) return { type: 'info', icon: 'ℹ️' };
            if (severity === 2) return { type: 'warn', icon: '⚠️' };
            return { type: 'error', icon: '❌' };
        }

        async function fetchStatus() {
            if (isPaused) return;
            requestCount++;
            document.getElementById('badgeRequests').textContent = requestCount;

            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const now = new Date(data.time).toLocaleTimeString('fa-IR');

                // بروزرسانی نشان‌گرها
                document.getElementById('badgeStatus').textContent = data.status;
                document.getElementById('badgeStatus').style.color = data.status === 'online' ? '#22c55e' : '#ef4444';
                document.getElementById('badgeUptime').textContent = Math.floor(data.uptime) + 's';
                document.getElementById('badgeMemory').textContent = data.memory + ' MB';

                // افزودن لاگ
                const memMB = data.memory;
                const severity = memMB > 150 ? 3 : memMB > 100 ? 2 : memMB > 60 ? 1 : 0;
                const logType = getLogType(severity);

                addLogEntry({
                    time: now,
                    type: logType.type,
                    icon: logType.icon,
                    message: `سرور آنلاین | آپتایم: ${Math.floor(data.uptime)}s | حافظه: ${memMB} MB | Node: ${data.node}`,
                });

                // هر ۱۰ ثانیه یک لاگ تصادفی اضافه کن
                if (Math.random() > 0.7) {
                    const randomLogs = [
                        { type: 'info', icon: 'ℹ️', message: 'درخواست GET به /api/status پاسخ ۲۰۰ داد.' },
                        { type: 'info', icon: 'ℹ️', message: 'صفحه /products با موفقیت بارگذاری شد.' },
                        { type: 'warn', icon: '⚠️', message: 'تأخیر در پاسخ‌دهی API (بیش از ۲۰۰ms).' },
                        { type: 'success', icon: '✅', message: 'سیستم کش با موفقیت پاک‌سازی شد.' },
                        { type: 'error', icon: '❌', message: 'تلاش ناموفق برای اتصال به پایگاه داده (timeout).' },
                    ];
                    const log = randomLogs[Math.floor(Math.random() * randomLogs.length)];
                    addLogEntry({ ...log, time: now });
                }
            } catch (e) {
                addLogEntry({ time: new Date().toLocaleTimeString('fa-IR'), type: 'error', icon: '❌', message: 'خطا در اتصال به سرور!' });
            }
        }

        function addLogEntry(entry) {
            const container = document.getElementById('logContainer');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `
                <span class="log-time">${entry.time}</span>
                <span class="log-type type-${entry.type}">${entry.icon} ${entry.type.toUpperCase()}</span>
                <span class="log-message">${entry.message}</span>
            `;
            container.insertBefore(div, container.firstChild);

            // محدود کردن تعداد لاگ‌ها
            while (container.children.length > maxEntries) {
                container.removeChild(container.lastChild);
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = isPaused ? '▶️ ادامه' : '⏸️ توقف';
            btn.className = isPaused ? 'btn btn-success' : 'btn btn-pause';
            if (!isPaused) {
                fetchStatus();
                addLogEntry({ time: new Date().toLocaleTimeString('fa-IR'), type: 'info', icon: 'ℹ️', message: 'لاگ‌ها از سر گرفته شد.' });
            } else {
                addLogEntry({ time: new Date().toLocaleTimeString('fa-IR'), type: 'warn', icon: '⚠️', message: 'لاگ‌ها متوقف شد.' });
            }
        }

        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            addLogEntry({ time: new Date().toLocaleTimeString('fa-IR'), type: 'info', icon: 'ℹ️', message: 'لاگ‌ها پاک شد.' });
        }

        function exportLog() {
            const entries = [];
            document.querySelectorAll('.log-entry').forEach(el => {
                entries.push({
                    time: el.querySelector('.log-time')?.textContent,
                    type: el.querySelector('.log-type')?.textContent?.trim(),
                    message: el.querySelector('.log-message')?.textContent,
                });
            });
            const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tetrashop-logs-' + new Date().toISOString().slice(0, 19) + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // شروع
        fetchStatus();
        setInterval(fetchStatus, interval);
        addLogEntry({ time: new Date().toLocaleTimeString('fa-IR'), type: 'info', icon: 'ℹ️', message: 'سیستم لاگ زنده راه‌اندازی شد.' });
    </script>
</body>
</html>
